name: CI 연습

on:
  workflow_dispatch: # GitHub에서 수동 실행 버튼 활성화
  push: # push할 때도 실행

permissions:
  contents: read
  id-token: write

jobs:
  hello:
    runs-on: ubuntu-24.04-arm # ARM64 EC2와 동일한 CPU 아키텍처에서 빌드·테스트

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::135133927568:role/test-app-github-actions
          aws-region: ap-northeast-1

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2
    
      - name: 파일 확인
        run: ls -la

      - name: Docker 이미지 빌드
        run: docker build -t test-app .

      - name: Docker 안에서 테스트
        run: docker run --rm test-app python -m pytest -v tests

      - name: ECR에 이미지 push
        env:
          ECR_REPOSITORY: 135133927568.dkr.ecr.ap-northeast-1.amazonaws.com/test-app
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          docker tag test-app:latest "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
