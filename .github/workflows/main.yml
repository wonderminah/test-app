name: CI 연습

on:
  workflow_dispatch: # GitHub에서 수동 실행 버튼 활성화
  push: # push할 때도 실행

jobs:
  hello:
    runs-on: ubuntu-latest # GitHub에서 제공하는 실행 환경

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
    
      - name: 파일 확인
        run: ls -la

      - name: Docker 이미지 빌드
        run: docker build -t test-app .

      - name: Docker 안에서 테스트
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            test-app \
            sh -c "python -m pip install pytest httpx && python -m pytest -v tests"
